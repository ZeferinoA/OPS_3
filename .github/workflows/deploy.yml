name: Deploy Custom Minecraft Image to ECR

# Triggers the pipeline whenever a git tag starting with 'v' is pushed
on:
  push:
    tags:
      - 'v*'

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: minecraft-server-repo

jobs:
  # ---------------------------------------------------
  # PHASE 1: LINTING & SECURITY (Extra Credit +3)
  # ---------------------------------------------------
  lint-and-scan:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Security Scan (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.3

      - name: Ansible Lint
        uses: ansible/ansible-lint@v6

  # ---------------------------------------------------
  # PHASE 2: BUILD, TEST, AND PUSH
  # ---------------------------------------------------
  build-test-push:
    name: Build Custom Image, Smoke Test, and Push
    needs: lint-and-scan # Ensures this job only runs if the linting passes!
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Tag Image from Dockerfile
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.ref_name }} # Grabs the git tag (e.g., v1.0.0)
        run: |
          echo "Building custom image from local Dockerfile..."
          # The '.' tells Docker to build using the Dockerfile in the root of the repository
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

          echo "Applying 'latest' tag for Ansible ease-of-use..."
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Smoke Test the Container
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          echo "Starting the custom Minecraft container..."
          docker run -d --name mc-smoke -e EULA=TRUE -e MEMORY=1G $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          # Polling loop to wait for the Java server to fully initialize
          SUCCESS=0
          for i in $(seq 1 15); do
            echo "Waiting for server to initialize... Attempt $i of 15"
            sleep 10
            # Checking the container logs for the standard Minecraft 'Done' message
            if docker logs mc-smoke | grep -q 'Done'; then
              echo "Smoke test passed! Server successfully initialized."
              SUCCESS=1
              break
            fi
          done

          # Clean up the test container so it doesn't block future jobs
          docker rm -f mc-smoke

          # If the loop finished without finding 'Done', fail the pipeline
          if [ $SUCCESS -eq 0 ]; then
            echo "Smoke test failed: Server did not output 'Done' within 150 seconds."
            exit 1
          fi

      - name: Push Images to AWS ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          echo "Pushing tagged version to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "Pushing 'latest' tag to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
