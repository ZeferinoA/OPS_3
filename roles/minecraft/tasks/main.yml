---
- name: Install Docker and AWS CLI
  ansible.builtin.dnf:
    name:
      - docker
      - awscli
    state: present

- name: Start and enable Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Create Minecraft data directory
  ansible.builtin.file:
    path: "{{ minecraft_root_dir }}"
    state: directory
    mode: '0755'

- name: Restore World Data from S3
  ansible.builtin.command:
    cmd: "aws s3 sync s3://{{ minecraft_s3_bucket }}/ {{ minecraft_root_dir }}/"
  register: s3_res
  changed_when: "'download:' in s3_res.stdout"

- name: Authenticate Docker to ECR
  ansible.builtin.shell: |
    set -o pipefail
    aws ecr get-login-password --region {{ minecraft_aws_region }} | docker login --username AWS --password-stdin {{ minecraft_ecr_registry }}
  args:
    executable: /bin/bash
  changed_when: false

- name: Pull and Start Minecraft Container
  community.docker.docker_container:
    name: minecraft-server
    image: "{{ minecraft_ecr_registry }}:{{ minecraft_image_tag }}"
    state: started
    restart_policy: always
    ports:
      - "{{ minecraft_port }}:25565"
    volumes:
      - "{{ minecraft_root_dir }}:/data"
    env:
      EULA: "TRUE"
      MEMORY: "{{ minecraft_memory }}"
