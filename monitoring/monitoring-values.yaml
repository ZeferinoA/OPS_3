# monitoring-values.yaml

# Constrain Prometheus
prometheus:
  prometheusSpec:
    retention: 2d
    replicas: 1
    resources:
      requests:
        memory: "1Gi"
        cpu: "250m"
      limits:
        memory: "2Gi"
        cpu: "1"
    serviceMonitorSelectorNilUsesHelmValues: false

# Constrain Alertmanager
alertmanager:
  alertmanagerSpec:
    replicas: 1
    resources:
      requests:
        memory: "50Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"

# Disable automatic dashboard sidecars to save resources
# (You will build your targeted dashboard manually)
grafana:
  sidecar:
    dashboards:
      enabled: false
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "200m"

# Keep these enabled: they provide your Node and Pod health metrics
kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true
